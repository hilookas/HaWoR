[project]
name = "hawor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aitviewer",
    "chumpy",
    "dill>=0.4.0",
    "droid-slam",
    "easydict>=1.13",
    "einops>=0.8.1",
    "evo>=1.34.0",
    "gradio>=6.2.0",
    "html4vision>=0.6.1",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "joblib>=1.5.3",
    "lapx>=0.9.3",
    "lietorch",
    "lightning-utilities",
    "loguru>=0.7.3",
    "mmcv==1.3.9",
    "mmengine==0.10.4",
    "moderngl-window==2.4.6",
    "natsort>=8.4.0",
    "numpy==1.26.4",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "plyfile>=1.1.3",
    "pulp>=3.3.0",
    "pycocotools>=2.0.11",
    "pyrender>=0.1.45",
    "pyrootutils>=1.0.4",
    "pytorch-lightning",
    "pytorch-minimize>=0.0.2",
    "pytorch3d",
    "rich>=14.2.0",
    "scikit-image>=0.25.2",
    "smplx==0.1.28",
    "supervision>=0.27.0",
    "timm>=1.0.22",
    "torch==2.5.1",
    "torch-scatter==2.1.2",
    "torchmetrics",
    "torchvision",
    "ultralytics>=8.3.248",
    "webdataset>=1.0.2",
    "xtcocotools>=1.14.3",
    "yacs>=0.1.8",
]

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
pytorch3d = ["torch==2.5.1", "jinja2"]
torch-scatter = ["torch==2.5.1", "jinja2"]
droid-slam = ["torch==2.5.1", "numpy", "jinja2"]
lietorch = ["torch==2.5.1", "numpy", "jinja2"]

[tool.uv.sources]
chumpy = { git = "https://github.com/mattloper/chumpy" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "stable" }
droid-slam = { workspace = true }
lietorch = { workspace = true }

[tool.uv.workspace]
members = [
    "thirdparty/DROID-SLAM",
    "thirdparty/DROID-SLAM/thirdparty/lietorch",
]
